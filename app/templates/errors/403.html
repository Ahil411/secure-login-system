{% extends "base.html" %}

{% block content %}
<div class="text-center">
    <div class="error mx-auto" data-text="403">
        <p class="m-0">403</p>
    </div>
    <p class="text-gray-500 mb-0">Access Forbidden</p>
    <p class="lead text-gray-800 mb-5">You don't have permission to access this resource</p>
    <p class="text-gray-500 mb-0">Please contact an administrator if you believe you should have access.</p>
    <a href="{{ url_for('main.dashboard') }}">&larr; Back to Dashboard</a>
</div>

<style>
.error {
    font-size: 7rem;
    position: relative;
    line-height: 1;
    width: 12.5rem;
}

.error:before {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    color: #eee;
    z-index: -1;
}
</style>
{% endblock %}
