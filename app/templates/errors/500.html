{% extends "base.html" %}

{% block content %}
<div class="text-center">
    <div class="error mx-auto" data-text="500">
        <p class="m-0">500</p>
    </div>
    <p class="text-gray-500 mb-0">Internal Server Error</p>
    <p class="lead text-gray-800 mb-5">Something went wrong on our end...</p>
    <p class="text-gray-500 mb-0">We're working to fix the issue. Please try again later.</p>
    <a href="{{ url_for('main.index') }}">&larr; Back to Home</a>
</div>

<style>
.error {
    font-size: 7rem;
    position: relative;
    line-height: 1;
    width: 12.5rem;
}

.error:before {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    color: #eee;
    z-index: -1;
}
</style>
{% endblock %}
